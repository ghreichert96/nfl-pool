name: NFL score ingestion

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-score-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh NFL scores
        env:
          INGEST_URL: ${{ secrets.ODDS_INGEST_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$INGEST_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --retry 2 --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$INGEST_URL/api/cron/live-status"
