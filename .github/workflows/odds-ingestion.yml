name: Odds ingestion

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Refresh existing weeks or initialize the upcoming week
        required: true
        default: refresh
        type: choice
        options:
          - refresh
          - initialize
          - finalize
  schedule:
    # Native Eastern scheduling handles DST; delayed runs still ingest.
    - cron: "0 12 * * 0"
      timezone: America/New_York
    - cron: "0 2 * * 1"
      timezone: America/New_York
    - cron: "0 20 * * 2,3"
      timezone: America/New_York
    - cron: "0 20 * * 4"
      timezone: America/New_York

permissions:
  contents: read

concurrency:
  group: nfl-odds-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Select ingestion mode
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mode=${MANUAL_MODE:-refresh}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$SCHEDULE" in
            "0 12 * * 0")
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "mode=initialize" >> "$GITHUB_OUTPUT"
              ;;
            "0 2 * * 1"|"0 20 * * 2,3")
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "mode=refresh" >> "$GITHUB_OUTPUT"
              ;;
            "0 20 * * 4")
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "mode=finalize" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown schedule: $SCHEDULE" >&2
              exit 1
              ;;
          esac
      - name: Refresh NFL odds
        if: steps.schedule.outputs.run == 'true'
        env:
          INGEST_URL: ${{ secrets.ODDS_INGEST_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$INGEST_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --retry 2 --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$INGEST_URL/api/cron/odds?mode=${{ steps.schedule.outputs.mode }}"
