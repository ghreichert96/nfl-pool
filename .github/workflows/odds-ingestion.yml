name: Odds ingestion

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Refresh existing weeks or initialize the upcoming week
        required: true
        default: refresh
        type: choice
        options:
          - refresh
          - initialize
          - finalize

permissions:
  contents: read

concurrency:
  group: nfl-odds-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Select ingestion mode
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mode=${MANUAL_MODE:-refresh}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Only manual dispatch is supported" >&2
          exit 1
      - name: Refresh NFL odds
        if: steps.schedule.outputs.run == 'true'
        env:
          INGEST_URL: ${{ secrets.ODDS_INGEST_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$INGEST_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --retry 2 --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$INGEST_URL/api/cron/odds?mode=${{ steps.schedule.outputs.mode }}"
