name: Odds ingestion

on:
  workflow_dispatch:
  schedule:
    # Paired UTC hours cover EDT and EST. The ET gate below allows one run.
    - cron: "0 13,14 * * 2"
    - cron: "0 0,1 * * 4,5"

permissions:
  contents: read

concurrency:
  group: nfl-odds-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Eastern schedule window
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          slot=$(TZ=America/New_York date '+%u-%H')
          case "$slot" in
            2-09|3-20|4-20) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Refresh NFL odds
        if: steps.schedule.outputs.run == 'true'
        env:
          INGEST_URL: ${{ secrets.ODDS_INGEST_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$INGEST_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --retry 2 --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$INGEST_URL/api/cron/odds"
